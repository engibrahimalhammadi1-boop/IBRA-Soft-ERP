name: Build IBRA Soft ERP APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract project
        run: |
          unzip -q IBRA-ERP1.zip -d source

      - name: Install dependencies
        working-directory: source/IBRA-ERP1
        run: npm install

      - name: Prepare web files
        working-directory: source/IBRA-ERP1
        run: |
          mkdir -p www
          cp -R index.html css js data assets manifest.webmanifest sw.js www/

      - name: Generate Android project
        working-directory: source/IBRA-ERP1
        run: npx cap add android

      - name: Sync Capacitor
        working-directory: source/IBRA-ERP1
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: source/IBRA-ERP1/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IBRA-Soft-ERP-APK
          path: source/IBRA-ERP1/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
